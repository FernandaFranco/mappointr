# Read about fixtures at https://api.rubyonrails.org/classes/ActiveRecord/FixtureSet.html
#
# Países sintéticos com fronteiras quadradas simples, para que as consultas
# PostGIS (distance_from, contains?, centroid) tenham geometria real para usar.

# Quadrado de 10°x10° na origem (0,0). Centroide esperado: 5, 5
atlantis:
  name: Atlantis
  name_pt: Atlântida
  difficulty: medium
  excluded: false
  boundary: "SRID=4326;MULTIPOLYGON(((0 0, 10 0, 10 10, 0 10, 0 0)))"

# Mesmo tamanho, ~40° a leste. Excluído do sorteio, para testar o escopo :playable
pacifica:
  name: Pacifica
  name_pt: Pacífica
  difficulty: hard
  excluded: true
  boundary: "SRID=4326;MULTIPOLYGON(((40 0, 50 0, 50 10, 40 10, 40 0)))"

# Mesmo tamanho, ~20° a leste. Jogável, dificuldade easy.
edenia:
  name: Edenia
  name_pt: Edênia
  difficulty: easy
  excluded: false
  boundary: "SRID=4326;MULTIPOLYGON(((20 0, 30 0, 30 10, 20 10, 20 0)))"

# Mesmo tamanho, ~60° a leste. Jogável, dificuldade hard.
draconia:
  name: Draconia
  name_pt: Draconia
  difficulty: hard
  excluded: false
  boundary: "SRID=4326;MULTIPOLYGON(((60 0, 70 0, 70 10, 60 10, 60 0)))"
